*{box-sizing:border-box}
body{margin:0;background:#2B2540;font-family:'Noto Sans TC',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100dvh}

.frame{position:relative;width:390px;height:844px;max-width:100vw;max-height:100dvh;background:#F4EFFB;overflow:hidden;
 border-radius:28px;box-shadow:0 18px 60px rgba(0,0,0,.45)}
@media (max-width:430px){.frame{border-radius:0;height:100dvh;max-height:none}}
#bar{position:absolute;left:0;right:0;top:0;height:40px;z-index:30;display:flex;align-items:center;gap:8px;
 padding:0 10px;background:rgba(43,37,64,.92);color:#fff;font-size:14px}
#bar button{border:0;background:rgba(255,255,255,.16);color:#fff;font:inherit;font-size:13px;height:26px;
 padding:0 10px;border-radius:13px;cursor:pointer}
#now{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#view{position:absolute;inset:40px 0 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#view>div{width:390px;margin:0 auto}
#menu{position:absolute;inset:40px 0 0 0;z-index:25;background:#FFFDF8;overflow-y:auto;padding:12px 14px 28px;display:none}
#menu.on{display:block}
.mg{font-size:13px;font-weight:700;color:#5B4B9E;margin:14px 0 6px}
.mi{display:block;width:100%;text-align:left;border:2px solid #E3D9FA;background:#fff;color:#2B2540;
 font:inherit;font-size:15px;padding:10px 12px;border-radius:12px;margin-bottom:6px;cursor:pointer}
.mi:hover{border-color:#5B4B9E}
</style>

var stack=[];
function go(id,push){
  var t=document.querySelector('template[data-screen="'+id+'"]');
  if(!t){return;}
  if(push!==false && stack[stack.length-1]!==id) stack.push(id);

});
